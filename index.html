<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AEGIS">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><title>AEGIS Mobile V0.9</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#000;min-height:100%;overflow-x:hidden}
body{padding:calc(env(safe-area-inset-top) + 10px) 0 env(safe-area-inset-bottom)}
#app{position:relative;width:100%;max-width:430px;margin:auto;background:#000}
#master{display:block;width:100%;height:auto;pointer-events:none;user-select:none}
#voiceMask{position:absolute;left:2.5%;top:61.25%;width:95%;height:3.45%;background:rgba(2,7,17,.94);z-index:4;pointer-events:none}
#voice{position:absolute;left:2.5%;top:61.25%;width:95%;height:3.45%;z-index:5;pointer-events:none}
#glow{position:absolute;left:50%;top:37.8%;width:36%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
background:radial-gradient(circle,rgba(50,220,255,.24),rgba(15,100,255,.08) 42%,transparent 72%);filter:blur(11px);mix-blend-mode:screen;opacity:.06;z-index:3;pointer-events:none}
.tap{position:absolute;border:0;background:transparent;z-index:8}.core{left:28%;top:29%;width:44%;height:23%}
.toast{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);padding:7px 11px;border:1px solid rgba(80,220,255,.28);border-radius:999px;background:rgba(0,5,12,.9);color:#7feaff;font:11px -apple-system,sans-serif;opacity:0;transition:.15s;z-index:9;white-space:nowrap}.toast.on{opacity:1}
</style></head><body><div id="app">
<img id="master" src="aegis-mobile-master-v1.jpg?v=090" alt="AEGIS Guardian AI">
<div id="voiceMask"></div><canvas id="voice"></canvas><div id="glow"></div>
<button class="tap core" id="core" aria-label="Voice input"></button><div class="toast" id="toast"></div>
</div><script>
(()=>{const c=document.getElementById('voice'),x=c.getContext('2d'),g=document.getElementById('glow'),t=document.getElementById('toast');
let on=false,s=null,a=null,n=null,d=null,r=0,l=0,tt=0;
function toast(m){clearTimeout(tt);t.textContent=m;t.classList.add('on');tt=setTimeout(()=>t.classList.remove('on'),1100)}
function size(){const q=c.getBoundingClientRect(),p=Math.min(devicePixelRatio||1,2);c.width=q.width*p;c.height=q.height*p;x.setTransform(p,0,0,p,0,0)}
function paintIdle(z=0){if(on)return;size();let w=c.clientWidth,h=c.clientHeight,m=h/2;x.clearRect(0,0,w,h);const bars=92,gap=w/bars;for(let i=0;i<bars;i++){const p=i/(bars-1),center=.28+.72*Math.sin(Math.PI*p),drift=Math.abs(Math.sin(z*.0026+i*.41)+Math.sin(z*.00135-i*.19))*.5,amp=1.6+center*(h*.22)*(0.28+drift*.72),rr=Math.round(16+p*155),gg=Math.round(196-p*86),bb=255;x.strokeStyle=`rgba(${rr},${gg},${bb},.86)`;x.lineWidth=Math.max(1,w/620);x.shadowColor=p>.72?'#7f45ff':'#18cfff';x.shadowBlur=3.2;const px=(i+.5)*gap;x.beginPath();x.moveTo(px,m-amp/2);x.lineTo(px,m+amp/2);x.stroke()}x.shadowBlur=0;r=requestAnimationFrame(paintIdle)}
function paint(){if(!on||!n)return;size();n.getByteTimeDomainData(d);let w=c.clientWidth,h=c.clientHeight,m=h/2,sum=0;for(let v of d){v=(v-128)/128;sum+=v*v}l=l*.8+Math.sqrt(sum/d.length)*.2;let q=Math.min(1,l*7);x.clearRect(0,0,w,h);const bars=92,gap=w/bars;for(let i=0;i<bars;i++){const p=i/(bars-1),idx=Math.min(d.length-1,Math.floor(p*(d.length-1))),sample=Math.abs((d[idx]-128)/128),neighbor=Math.abs((d[Math.min(d.length-1,idx+2)]-128)/128),center=.25+.75*Math.sin(Math.PI*p),amp=2+(sample*.72+neighbor*.28)*(h*.78)*(0.55+q*.72)+center*q*(h*.08),rr=Math.round(10+p*175),gg=Math.round(205-p*95),bb=255;x.strokeStyle=`rgba(${rr},${gg},${bb},.96)`;x.lineWidth=Math.max(1,w/620)+q*.45;x.shadowColor=p>.72?'#8748ff':'#22d8ff';x.shadowBlur=4+q*8;const px=(i+.5)*gap;x.beginPath();x.moveTo(px,m-amp/2);x.lineTo(px,m+amp/2);x.stroke()}x.shadowBlur=0;g.style.opacity=.06+q*.42;g.style.transform=`translate(-50%,-50%) scale(${1+q*.04})`;r=requestAnimationFrame(paint)}
async function start(){try{s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});a=new(window.AudioContext||window.webkitAudioContext)();await a.resume();n=a.createAnalyser();n.fftSize=512;n.smoothingTimeConstant=.72;d=new Uint8Array(n.fftSize);a.createMediaStreamSource(s).connect(n);on=true;cancelAnimationFrame(r);toast('VOICE CHANNEL · LIVE');paint()}catch(e){toast('MICROPHONE PERMISSION REQUIRED')}}
async function stop(){on=false;if(s)s.getTracks().forEach(v=>v.stop());s=null;if(a)try{await a.close()}catch(e){}a=n=d=null;l=0;g.style.opacity=.06;g.style.transform='translate(-50%,-50%) scale(1)';cancelAnimationFrame(r);toast('VOICE CHANNEL · STANDBY');paintIdle()}
document.getElementById('core').onclick=()=>on?stop():start();document.addEventListener('visibilitychange',()=>{if(document.hidden&&on)stop()});addEventListener('resize',size);paintIdle();
if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(v=>v.forEach(q=>q.unregister())).catch(()=>{});if('caches'in window)caches.keys().then(v=>Promise.all(v.map(q=>caches.delete(q)))).catch(()=>{});
})();
</script></body></html>
