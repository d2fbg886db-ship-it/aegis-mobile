<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AEGIS">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>AEGIS Ver2 Safe Header</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
body{position:fixed;inset:0}
#app{position:fixed;inset:0;width:100vw;height:100dvh;background:#000;overflow:hidden}
#ui{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;user-select:none;-webkit-user-drag:none}

#cgLayer{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#coreFx{position:absolute;left:50%;top:39.3%;width:53%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;isolation:isolate}
.cg-ring,.cg-arc,.cg-core-glow,.cg-scan,.cg-particle{position:absolute}
.cg-ring{border-radius:50%;border:1px solid rgba(74,225,255,.33);box-shadow:0 0 8px rgba(50,215,255,.16),inset 0 0 8px rgba(50,215,255,.08);mix-blend-mode:screen}
.ring-outer{inset:3%;border-style:dashed;animation:spin 12s linear infinite}
.ring-mid{inset:13%;border-left-color:transparent;border-right-color:transparent;animation:spinR 8s linear infinite}
.ring-inner{inset:24%;border-style:dotted;animation:spin 5.5s linear infinite}
.cg-arc{border-radius:50%;border:1.6px solid transparent;border-top-color:rgba(81,231,255,.63);border-right-color:rgba(118,88,255,.48);filter:drop-shadow(0 0 5px rgba(76,220,255,.38));mix-blend-mode:screen}
.arc-a{inset:8%;animation:spin 6.4s linear infinite}.arc-b{inset:28%;animation:spinR 4.2s linear infinite}
.cg-core-glow{inset:35%;border-radius:50%;background:radial-gradient(circle,rgba(88,236,255,.26),rgba(26,118,255,.08) 50%,transparent 72%);filter:blur(6px);mix-blend-mode:screen;animation:breath 2.8s ease-in-out infinite}
.cg-scan{left:15%;right:15%;height:1px;background:linear-gradient(90deg,transparent,rgba(77,225,255,.58),transparent);box-shadow:0 0 6px rgba(77,225,255,.35);opacity:0}
.cg-particle{width:2px;height:2px;border-radius:50%;background:rgba(95,231,255,.84);box-shadow:0 0 5px rgba(80,225,255,.62);animation:drift var(--dur) ease-in-out var(--delay) infinite alternate}
.cg-particle.violet{background:rgba(181,91,255,.78);box-shadow:0 0 5px rgba(173,76,255,.58)}
#app[data-state="RECEIVED"] .ring-mid,#app[data-state="RECEIVED"] .ring-inner,#app[data-state="RECEIVED"] .arc-a,#app[data-state="RECEIVED"] .arc-b{animation-play-state:paused;opacity:.28}
#app[data-state="ANALYSIS"] .ring-outer{animation-duration:7s}#app[data-state="ANALYSIS"] .ring-mid{animation-duration:4.8s}#app[data-state="ANALYSIS"] .ring-inner{animation-duration:3.5s}
#app[data-state="VERIFYING"] .ring-outer{animation-duration:4.6s}#app[data-state="VERIFYING"] .ring-mid{animation-duration:3s}#app[data-state="VERIFYING"] .ring-inner{animation-duration:2.2s}#app[data-state="VERIFYING"] .arc-a{animation-duration:2.6s}#app[data-state="VERIFYING"] .arc-b{animation-duration:1.8s}#app[data-state="VERIFYING"] .cg-scan{animation:scan 2.7s ease-in-out infinite}#app[data-state="VERIFYING"] .cg-core-glow{animation-duration:1.55s}
#app[data-state="RESULT"] .ring-outer,#app[data-state="RESULT"] .ring-mid,#app[data-state="RESULT"] .ring-inner{animation-duration:14s}#app[data-state="RESULT"] .arc-a,#app[data-state="RESULT"] .arc-b{animation-duration:10s;opacity:.36}
#app[data-state="DECISION"] .ring-outer,#app[data-state="DECISION"] .ring-mid,#app[data-state="DECISION"] .ring-inner,#app[data-state="DECISION"] .arc-a,#app[data-state="DECISION"] .arc-b{animation-play-state:paused}
#statePanel{position:absolute;left:50%;bottom:1.4%;transform:translateX(-50%);z-index:3;display:flex;gap:4px;width:92%;justify-content:center}
#statePanel button{flex:1;padding:7px 3px;border:1px solid rgba(70,210,255,.18);border-radius:8px;background:rgba(0,5,12,.72);color:rgba(185,235,255,.62);font-size:8px}
#statePanel button.active{border-color:rgba(86,228,255,.54);color:#dffaff;background:rgba(11,43,64,.72)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinR{to{transform:rotate(-360deg)}}@keyframes breath{0%,100%{transform:scale(.93);opacity:.32}50%{transform:scale(1.07);opacity:.72}}@keyframes scan{0%{top:20%;opacity:0}12%{opacity:.55}82%{opacity:.48}100%{top:80%;opacity:0}}@keyframes drift{0%{transform:translate3d(-3px,-4px,0) scale(.72);opacity:.22}100%{transform:translate3d(5px,8px,0) scale(1.3);opacity:.88}}

</style>
</head>
<body>
<div id="app" data-state="VERIFYING">
  <img id="ui" src="aegis-ver2-safe-header-1242x2688.jpg?v=250" alt="AEGIS Ver2">
  <div id="cgLayer" aria-hidden="true">
    <div id="coreFx">
      <div class="cg-ring ring-outer"></div><div class="cg-ring ring-mid"></div><div class="cg-ring ring-inner"></div>
      <div class="cg-arc arc-a"></div><div class="cg-arc arc-b"></div>
      <div class="cg-core-glow"></div><div class="cg-scan"></div><div id="particles"></div>
    </div>
  </div>
  <div id="statePanel">
    <button data-state="RECEIVED">RECEIVED</button><button data-state="ANALYSIS">ANALYSIS</button><button data-state="VERIFYING">VERIFYING</button><button data-state="RESULT">RESULT</button><button data-state="DECISION">DECISION</button>
  </div>
</div>
<script>
(()=>{const app=document.getElementById('app'),pr=document.getElementById('particles');
for(let i=0;i<34;i++){const p=document.createElement('i');p.className='cg-particle'+(i%6===0?' violet':'');const a=Math.random()*Math.PI*2,r=34+Math.random()*40;p.style.left=(50+Math.cos(a)*r/2)+'%';p.style.top=(50+Math.sin(a)*r/2)+'%';p.style.setProperty('--dur',(3+Math.random()*4).toFixed(2)+'s');p.style.setProperty('--delay',(-Math.random()*3).toFixed(2)+'s');pr.appendChild(p)}
document.querySelectorAll('#statePanel button').forEach(b=>b.onclick=()=>{app.dataset.state=b.dataset.state;document.querySelectorAll('#statePanel button').forEach(x=>x.classList.toggle('active',x===b))});document.querySelector('[data-state="VERIFYING"]').classList.add('active');})();
</script>
</body>
</html>
