<title>AEGIS Ver2 — iPhone 11 Pro Max Fullscreen</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}
body{
  position:fixed;
  inset:0;
}
#viewport{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  overflow:hidden;
  background:#000;
}
#safe-frame,
#device-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  max-width:none;
  max-height:none;
  overflow:hidden;
  background:#000;
}
#baseline{
  position:absolute;
  inset:0;
  display:block;
  width:100vw;
  height:100dvh;
  max-width:none;
  max-height:none;
  object-fit:fill;
  object-position:center center;
  user-select:none;
  -webkit-user-drag:none;
}
</style>
</head>
<body>
<div id="viewport">
  <div id="safe-frame">
    <div id="device-frame">
      <img id="baseline"
           src="aegis-ver2-iphone11promax-1242x2688.jpg?v=212fs"
           alt="AEGIS Ver2">
    </div>
  </div>
</div>
</body>
