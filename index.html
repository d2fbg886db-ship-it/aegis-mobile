<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AEGIS">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>AEGIS Ver2 — iPhone 11 Pro Max Top Left Scale Fix</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}
body{
  position:fixed;
  inset:0;
}
#viewport{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  overflow:hidden;
  background:#000;
}
#safe-frame,
#device-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  max-width:none;
  max-height:none;
  overflow:hidden;
  background:#000;
}
#baseline{
  position:absolute;
  inset:0;
  display:block;
  width:100vw;
  height:100dvh;
  max-width:none;
  max-height:none;
  object-fit:fill;
  object-position:center center;
  user-select:none;
  -webkit-user-drag:none;
}

/* Ver2.2: keep original position; scale ONLY AEGIS / GUARDIAN AI smaller */
#topLeftMask{
  position:absolute;
  left:0;
  top:0;
  width:43%;
  height:12.5%;
  background:#000;
  z-index:2;
  pointer-events:none;
}
#topLeftCrop{
  position:absolute;
  left:0;
  top:0;
  width:43%;
  height:12.5%;
  overflow:hidden;
  z-index:3;
  pointer-events:none;
}
#topLeftClone{
  position:absolute;
  left:0;
  top:0;
  width:100vw;
  height:100dvh;
  object-fit:fill;
  object-position:center center;
  transform-origin:0 0;
  transform:scale(.88);
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}

</style>
</head>
<body>
<div id="viewport">
  <div id="safe-frame">
    <div id="device-frame">
      <img id="baseline"
           src="aegis-ver2-iphone11promax-1242x2688.jpg?v=214sc"
           alt="AEGIS Ver2">
      <div id="topLeftMask"></div>
      <div id="topLeftCrop">
        <img id="topLeftClone"
             src="aegis-ver2-iphone11promax-1242x2688.jpg?v=214sc"
             alt="">
      </div>
    </div>
  </div>
</div>
</body>
</html>
