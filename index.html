<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AEGIS">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>AEGIS Ver2 Restoration</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;min-height:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{width:100%;max-width:430px;margin:0 auto;background:#000}
#baseline{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
</style>
</head>
<body>
<div id="app">
  <img id="baseline" src="aegis-ver2-baseline.jpg?v=200" alt="AEGIS Ver2 visual baseline">
</div>
</body>
</html>
