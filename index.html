<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AEGIS">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>AEGIS Ver2 — iPhone 11 Pro Max</title>
<style>
:root{
  --iphone-width:414;
  --iphone-height:896;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}
body{
  position:fixed;
  inset:0;
}
#viewport{
  position:absolute;
  inset:0;
  width:100vw;
  height:100dvh;
  overflow:hidden;
  background:#000;
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}
#safe-frame{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#000;
}
#device-frame{
  position:relative;
  /* Ver2 keeps its original full-screen ratio. */
  aspect-ratio:414 / 896;
  width:min(100%, calc(100vh * 414 / 896));
  max-height:100%;
  overflow:hidden;
  background:#000;
}
#baseline{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
}
@supports(height:100dvh){
  #device-frame{
    width:min(100%, calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 414 / 896));
  }
}
</style>
</head>
<body>
<div id="viewport">
  <div id="safe-frame">
    <div id="device-frame">
      <img id="baseline"
           src="aegis-ver2-iphone11promax-1242x2688.jpg?v=211pm"
           alt="AEGIS Ver2">
    </div>
  </div>
</div>
</body>
</html>
