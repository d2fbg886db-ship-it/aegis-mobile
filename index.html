<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#020711">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AEGIS">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>AEGIS Mobile V0.2</title>
  <style>
    :root{
      --bg:#020711;--panel:#061321;--line:rgba(84,223,255,.28);
      --cyan:#6eeaff;--cyan2:#1ba9ff;--text:#e9fbff;--muted:#7ca4b3;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:radial-gradient(circle at 50% 34%,#082941 0,#020711 43%,#01040a 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100%}
    body{padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
    .wrap{max-width:430px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden}
    .grid{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(#000,transparent 80%);pointer-events:none}
    header{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 6px;position:relative;z-index:5}
    .brand{font-weight:700;letter-spacing:.15em}.sub{font-size:11px;color:var(--muted);margin-top:3px}.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:7px 9px;color:var(--cyan)}
    .hud{border:1px solid var(--line);border-radius:26px;padding:15px;background:rgba(3,12,22,.62);backdrop-filter:blur(8px);position:relative;overflow:hidden}
    .row{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}
    .mini{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .mini>div{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:rgba(5,17,30,.62);display:flex;justify-content:space-between}
    .mini b{color:var(--cyan)}
    .stage{position:relative;width:min(92vw,390px);aspect-ratio:1;margin:-4px auto -8px;display:grid;place-items:center;isolation:isolate}
    .stage:before{content:"";position:absolute;inset:7%;border-radius:50%;background:radial-gradient(circle,rgba(60,220,255,.25),transparent 62%);filter:blur(10px);animation:breathe 3.3s ease-in-out infinite}
    .ring,.arc,.halo,.scan,.beam,.orb,.particle{position:absolute}
    .ring{border-radius:50%;border:1px solid var(--cyan);box-shadow:0 0 12px rgba(70,220,255,.35),inset 0 0 12px rgba(70,220,255,.15)}
    .r1{inset:8%;border-style:dashed;opacity:.5;animation:spin 9s linear infinite}.r2{inset:15%;border-width:2px;border-left-color:transparent;border-right-color:transparent;animation:spinR 6.8s linear infinite}.r3{inset:23%;border-style:dotted;animation:spin 4.8s linear infinite}.r4{inset:31%;border-width:2px;border-top-color:transparent;animation:spinR 3.6s linear infinite}.r5{inset:39%;border-left-color:transparent;border-bottom-color:transparent;animation:spin 2.5s linear infinite}
    .arc{border-radius:50%;border:2px solid transparent;border-top-color:var(--cyan);border-right-color:var(--cyan);filter:drop-shadow(0 0 6px var(--cyan));opacity:.75}.a1{inset:6%;animation:spin 5.5s linear infinite}.a2{inset:20%;animation:spinR 4.1s linear infinite}.a3{inset:35%;animation:spin 2.9s linear infinite}
    .halo{left:18%;right:18%;height:9%;border:1px solid var(--cyan);border-radius:50%;opacity:.5;filter:drop-shadow(0 0 7px var(--cyan))}.h1{top:7%;animation:float 3s ease-in-out infinite}.h2{bottom:8%;animation:floatR 3.7s ease-in-out infinite}
    .scan{left:10%;right:10%;height:1px;background:var(--cyan);box-shadow:0 0 9px var(--cyan);z-index:7;animation:scan 3s ease-in-out infinite}.beam{top:6%;bottom:6%;width:1px;background:linear-gradient(transparent,var(--cyan),transparent);left:50%;opacity:.4;animation:beam 2.5s ease-in-out infinite}
    .orb{width:27%;aspect-ratio:1;border-radius:50%;border:2px solid var(--cyan);background:radial-gradient(circle at 50% 45%,rgba(85,235,255,.38),rgba(3,15,29,.96) 65%);box-shadow:0 0 34px rgba(80,228,255,.62),inset 0 0 30px rgba(80,228,255,.28);z-index:8;display:grid;place-items:center;animation:orb 2s ease-in-out infinite}
    .shield{width:46%;aspect-ratio:1;clip-path:polygon(50% 0,92% 16%,79% 72%,50% 100%,21% 72%,8% 16%);border:2px solid var(--cyan);display:grid;place-items:center;font-weight:800;color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
    .particle{width:3px;height:3px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);opacity:.65;animation:drift 3s ease-in-out infinite alternate}
    .labels{text-align:center;margin-top:-12px}.mode{font-weight:700;letter-spacing:.12em}.desc{font-size:12px;color:var(--muted);margin-top:5px}
    .flow{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:10px;background:rgba(4,14,25,.68)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.step{border:1px solid var(--line);border-radius:9px;padding:7px 2px;text-align:center;font-size:10px;color:var(--muted)}.step.active{border-color:var(--cyan);color:var(--text);background:rgba(70,220,255,.09)}#decision{font-size:12px;color:var(--muted);margin-top:9px}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.buttons button{appearance:none;border:1px solid var(--line);border-radius:12px;padding:13px 8px;background:rgba(4,16,29,.82);color:var(--text);font:inherit}.buttons button:active{background:rgba(70,220,255,.12)}
    .stage.listening .r1{animation-duration:4s}.stage.listening .r2{animation-duration:3s}.stage.listening .r3{animation-duration:2.2s}.stage.verifying .r1{animation-duration:2.7s}.stage.verifying .r2{animation-duration:1.9s}.stage.verifying .r3{animation-duration:1.4s}.stage.verifying .r4{animation-duration:1.05s}.stage.verifying .r5{animation-duration:.82s}.stage.verifying .scan{animation-duration:1.3s}.stage.approved .orb{animation-duration:.7s}.stage.stopped .ring,.stage.stopped .arc,.stage.stopped .halo,.stage.stopped .scan,.stage.stopped .beam,.stage.stopped .particle{animation-play-state:paused;opacity:.16}.stage.stopped .orb{animation:none}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes spinR{to{transform:rotate(-360deg)}}@keyframes breathe{50%{transform:scale(1.06);opacity:1}}@keyframes orb{50%{transform:scale(1.05)}}@keyframes scan{0%{top:17%;opacity:0}20%{opacity:.9}80%{opacity:.9}100%{top:82%;opacity:0}}@keyframes beam{50%{opacity:.75;transform:scaleY(1.04)}}@keyframes float{50%{transform:translateY(5px) scaleX(1.04)}}@keyframes floatR{50%{transform:translateY(-5px) scaleX(.9)}}@keyframes drift{to{transform:translate(5px,8px) scale(1.35);opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="grid"></div>
  <header>
    <div><div class="brand">AEGIS</div><div class="sub">GUARDIAN AI · MOBILE CORE</div></div>
    <div class="badge" id="badge">SYSTEM ONLINE</div>
  </header>
  <main class="hud">
    <div class="row"><span>LINK: JARVIS</span><span>SECURITY: LOCKED</span></div>
    <div class="mini"><div><span>THREAT</span><b>LOW</b></div><div><span>INTEGRITY</span><b>100%</b></div></div>
    <section class="stage standby" id="stage">
      <div class="beam"></div><div class="scan"></div>
      <div class="halo h1"></div><div class="halo h2"></div>
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div><div class="ring r5"></div>
      <div class="arc a1"></div><div class="arc a2"></div><div class="arc a3"></div>
      <div class="orb"><div class="shield">A</div></div>
      <div id="particles"></div>
    </section>
    <div class="mini"><div><span>SCAN MODE</span><b id="scanMode">PASSIVE</b></div><div><span>MEMORY</span><b>ISOLATED</b></div></div>
    <div class="labels"><div class="mode" id="mode">STANDBY</div><div class="desc" id="desc">Guardian core stable.</div></div>
    <section class="flow">
      <div class="steps"><div class="step active">RECEIVED</div><div class="step">ANALYSIS</div><div class="step">VERIFY</div><div class="step">RESULT</div></div>
      <div id="decision">Awaiting command.</div>
    </section>
    <div class="buttons">
      <button id="listen">LISTEN</button><button id="verify">VERIFY</button>
      <button id="approve">APPROVE</button><button id="stop">CRITICAL STOP</button>
    </div>
  </main>
</div>
<script>
const stage=document.getElementById('stage'),mode=document.getElementById('mode'),desc=document.getElementById('desc'),scanMode=document.getElementById('scanMode'),decision=document.getElementById('decision'),badge=document.getElementById('badge'),steps=[...document.querySelectorAll('.step')],pf=document.getElementById('particles');
for(let i=0;i<72;i++){const p=document.createElement('i');p.className='particle';const a=Math.random()*Math.PI*2,r=34+Math.random()*42;p.style.left=(50+Math.cos(a)*r/2)+'%';p.style.top=(50+Math.sin(a)*r/2)+'%';p.style.animationDelay=(Math.random()*2.5)+'s';p.style.animationDuration=(2.2+Math.random()*3.5)+'s';pf.appendChild(p)}
function flow(n){steps.forEach((s,i)=>s.classList.toggle('active',i===n))}
function state(c,m,d,s,n){stage.className='stage '+c;mode.textContent=m;desc.textContent=d;scanMode.textContent=s;flow(n);badge.textContent=c==='stopped'?'CORE LOCKED':'SYSTEM ONLINE'}
listen.onclick=()=>{state('listening','LISTENING','Voice interface simulation active.','VOICE',1);decision.textContent='Awaiting spoken command.'}
verify.onclick=()=>{state('verifying','VERIFYING','Evidence verification in progress.','DEEP',2);decision.textContent='Cross-checking evidence, policy and risk...';setTimeout(()=>{if(stage.classList.contains('verifying')){flow(3);decision.textContent='REQUEST_EVIDENCE — integrity evidence incomplete.'}},1800)}
approve.onclick=()=>{state('approved','APPROVED','Verification result accepted for prototype.','CLEAR',3);decision.textContent='Execution remains simulated in V0.2.'}
stop.onclick=()=>{state('stopped','CRITICAL STOP','All simulated authority locked.','LOCKED',3);decision.textContent='Manual release required.'}
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body></html>
