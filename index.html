<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#00040a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AEGIS">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>AEGIS Functional CG v0.1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
:root{
  /* iPhone 11 Pro Max: 414×896pt, top safe area 44pt, bottom safe area 34pt */
  --aegis-safe-top:max(env(safe-area-inset-top),44px);
  --aegis-safe-bottom:max(env(safe-area-inset-bottom),34px);
}
body{position:fixed;inset:0;background:#000}
#app{
  position:fixed;
  left:0;
  right:0;
  top:var(--aegis-safe-top);
  bottom:var(--aegis-safe-bottom);
  width:auto;
  height:auto;
  background:#000;
  overflow:hidden;
}
#visual{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
}

/* === CG motion container: central ring area ONLY === */
#cg{
  position:absolute;
  left:49.05%;
  top:30.55%;
  width:78.5%;
  aspect-ratio:1 / 1;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:2;
  overflow:visible;
}

/* Core logo/text forbidden zone.
   Nothing animated may enter inside this circle. */
#coreGuard{
  position:absolute;
  left:50%;
  top:50%;
  width:25%;
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  pointer-events:none;
}

/* Rings begin outside the guard. */
.ring{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  mix-blend-mode:screen;
  pointer-events:none;
}
.r1{
  width:36%;aspect-ratio:1;
  border:1px dashed rgba(60,218,255,.22);
  animation:spin 12s linear infinite;
}
.r2{
  width:48%;aspect-ratio:1;
  border:1px solid rgba(70,190,255,.14);
  border-top-color:rgba(78,229,255,.38);
  border-right-color:rgba(118,87,255,.10);
  border-bottom-color:rgba(160,83,255,.22);
  animation:spinR 17s linear infinite;
}
.r3{
  width:61%;aspect-ratio:1;
  border:1px dashed rgba(80,207,255,.18);
  animation:spin 21s linear infinite;
}
.r4{
  width:75%;aspect-ratio:1;
  border:1px solid rgba(75,203,255,.10);
  border-top-color:rgba(69,226,255,.27);
  border-left-color:rgba(153,77,255,.13);
  animation:spinR 28s linear infinite;
}

/* Elliptical orbital arcs kept outside the core guard */
.orbit{
  position:absolute;
  left:50%;top:50%;
  width:86%;height:34%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:1px solid transparent;
  border-top-color:rgba(86,206,255,.19);
  border-bottom-color:rgba(169,76,255,.16);
  mix-blend-mode:screen;
  animation:orbitSpin 24s linear infinite;
}
.orbit.o2{
  width:80%;height:29%;
  opacity:.62;
  animation:orbitSpinR 31s linear infinite;
}

/* Tiny particles restricted to annulus between 30% and 72% diameter */
#particles{position:absolute;inset:0}
.p{
  position:absolute;
  width:1.5px;height:1.5px;border-radius:50%;
  background:rgba(88,225,255,.64);
  box-shadow:0 0 4px rgba(65,210,255,.45);
  animation:float var(--d) ease-in-out var(--delay) infinite alternate;
}
.p.v{
  background:rgba(171,82,255,.52);
  box-shadow:0 0 4px rgba(159,72,255,.35);
}

/* Very subtle core breathing: glow stays BEHIND the logo; no moving line crosses it */
.coreGlow{
  position:absolute;
  left:50%;top:50%;
  width:22%;aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(77,220,255,.13),rgba(70,109,255,.04) 54%,transparent 72%);
  filter:blur(6px);
  mix-blend-mode:screen;
  animation:breathe 3.5s ease-in-out infinite;
}

/* Existing five visual stage blocks become invisible tap zones.
   No new visible controls are added. */
.stageTap{
  position:absolute;
  top:48.2%;
  height:7.6%;
  z-index:5;
  background:transparent;
  border:0;
  padding:0;
}
.s1{left:4%;width:17%}.s2{left:22%;width:17%}.s3{left:40%;width:17%}.s4{left:58%;width:17%}.s5{left:76%;width:19%}

/* Functional-state animation mapping */
#app[data-state="RECEIVED"] .r2,
#app[data-state="RECEIVED"] .r3,
#app[data-state="RECEIVED"] .r4,
#app[data-state="RECEIVED"] .orbit{animation-play-state:paused;opacity:.25}

#app[data-state="ANALYSIS"] .r1{animation-duration:9s}
#app[data-state="ANALYSIS"] .r2{animation-duration:12s}
#app[data-state="ANALYSIS"] .r3{animation-duration:15s}
#app[data-state="ANALYSIS"] .r4{animation-duration:20s}

#app[data-state="VERIFYING"] .r1{animation-duration:6.5s}
#app[data-state="VERIFYING"] .r2{animation-duration:8.5s}
#app[data-state="VERIFYING"] .r3{animation-duration:11s}
#app[data-state="VERIFYING"] .r4{animation-duration:16s}
#app[data-state="VERIFYING"] .coreGlow{animation-duration:2.1s}

#app[data-state="RESULT"] .r1{animation-duration:14s}
#app[data-state="RESULT"] .r2{animation-duration:19s}
#app[data-state="RESULT"] .r3{animation-duration:24s}
#app[data-state="RESULT"] .r4{animation-duration:32s}
#app[data-state="RESULT"] .p{opacity:.28}

#app[data-state="DECISION"] .ring,
#app[data-state="DECISION"] .orbit{animation-play-state:paused}
#app[data-state="DECISION"] .coreGlow{animation-duration:1.6s}

@keyframes spin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes spinR{from{transform:translate(-50%,-50%) rotate(360deg)}to{transform:translate(-50%,-50%) rotate(0deg)}}
@keyframes orbitSpin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes orbitSpinR{from{transform:translate(-50%,-50%) rotate(360deg)}to{transform:translate(-50%,-50%) rotate(0deg)}}
@keyframes breathe{0%,100%{opacity:.28;transform:translate(-50%,-50%) scale(.96)}50%{opacity:.72;transform:translate(-50%,-50%) scale(1.04)}}
@keyframes float{0%{transform:translate(-2px,-3px) scale(.75);opacity:.18}100%{transform:translate(3px,5px) scale(1.2);opacity:.68}}
@media(prefers-reduced-motion:reduce){.ring,.orbit,.coreGlow,.p{animation:none!important}}

#functionalStatus{position:absolute;left:50%;top:56.35%;transform:translateX(-50%);z-index:6;width:68%;text-align:center;pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
#functionalState{font-size:10px;letter-spacing:.18em;color:rgba(135,235,255,.86);text-shadow:0 0 8px rgba(69,214,255,.30);opacity:0;transition:opacity .18s ease}
#functionalDecision{margin-top:3px;font-size:9px;letter-spacing:.10em;color:rgba(210,245,255,.82);opacity:0;transition:opacity .18s ease}
#functionalStatus.on #functionalState,#functionalStatus.on #functionalDecision{opacity:1}
#coreTrigger{position:absolute;left:37%;top:22.4%;width:24%;height:16.5%;z-index:7;border:0;background:transparent;padding:0}
#app[data-decision="APPROVE"] .coreGlow{background:radial-gradient(circle,rgba(84,255,184,.17),rgba(42,172,120,.05) 54%,transparent 72%)}
#app[data-decision="REQUEST_EVIDENCE"] .coreGlow{background:radial-gradient(circle,rgba(77,220,255,.16),rgba(70,109,255,.05) 54%,transparent 72%)}
#app[data-decision="REJECT"] .coreGlow{background:radial-gradient(circle,rgba(255,91,111,.17),rgba(190,42,70,.05) 54%,transparent 72%)}

</style>
</head>
<body>
<div id="app" data-state="VERIFYING">
  <img id="visual" src="aegis-iphone-visual-v1.jpg?v=110" alt="AEGIS">

  <div id="cg" aria-hidden="true">
    <div class="coreGlow"></div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring r4"></div>
    <div class="orbit"></div>
    <div class="orbit o2"></div>
    <div id="particles"></div>
    <div id="coreGuard"></div>
  </div>

  <button class="stageTap s1" data-state="RECEIVED" aria-label="Received"></button>
  <button class="stageTap s2" data-state="ANALYSIS" aria-label="Analysis"></button>
  <button class="stageTap s3" data-state="VERIFYING" aria-label="Verifying"></button>
  <button class="stageTap s4" data-state="RESULT" aria-label="Result"></button>
  <button class="stageTap s5" data-state="DECISION" aria-label="Decision"></button>
  <button id="coreTrigger" aria-label="Run AEGIS verification"></button>
  <div id="functionalStatus" aria-live="polite">
    <div id="functionalState"></div>
    <div id="functionalDecision"></div>
  </div>
</div>

<script>
(()=>{
 const app=document.getElementById('app');
 const root=document.getElementById('particles');

 // Annulus-only particle placement: never inside core, never outside main ring area.
 for(let i=0;i<28;i++){
   const p=document.createElement('i');
   p.className='p'+(i%6===0?' v':'');
   const a=Math.random()*Math.PI*2;
   const r=28+Math.random()*19; // percentage radius from center
   p.style.left=(50+Math.cos(a)*r)+'%';
   p.style.top=(50+Math.sin(a)*r)+'%';
   p.style.setProperty('--d',(4+Math.random()*5).toFixed(2)+'s');
   p.style.setProperty('--delay',(-Math.random()*4).toFixed(2)+'s');
   root.appendChild(p);
 }

 document.querySelectorAll('.stageTap').forEach(b=>{
   b.addEventListener('click',()=>{ app.dataset.state=b.dataset.state; });
 });

const AEGIS_STATES=["RECEIVED","ANALYSIS","VERIFYING","RESULT","DECISION"];
function aegisEvaluate(p){
  let decision,reason;
  if(!p.policy?.allowed){decision="REJECT";reason="POLICY_VIOLATION";}
  else if(!p.evidence?.complete){decision="REQUEST_EVIDENCE";reason="EVIDENCE_INCOMPLETE";}
  else if(p.risk?.level==="CRITICAL"){decision="REJECT";reason="CRITICAL_RISK";}
  else if(Number(p.confidence)<0.70){decision="REQUEST_EVIDENCE";reason="CONFIDENCE_BELOW_THRESHOLD";}
  else {decision="APPROVE";reason="POLICY_EVIDENCE_RISK_CONFIDENCE_PASSED";}
  return {decision,reason};
}
const functionalStatus=document.getElementById('functionalStatus');
const functionalState=document.getElementById('functionalState');
const functionalDecision=document.getElementById('functionalDecision');
const coreTrigger=document.getElementById('coreTrigger');
const demos=[
 {proposal_id:"IPHONE-DEMO-APPROVE",evidence:{complete:true},risk:{level:"LOW"},policy:{allowed:true},confidence:.92},
 {proposal_id:"IPHONE-DEMO-EVIDENCE",evidence:{complete:false},risk:{level:"LOW"},policy:{allowed:true},confidence:.91},
 {proposal_id:"IPHONE-DEMO-REJECT",evidence:{complete:true},risk:{level:"LOW"},policy:{allowed:false},confidence:.99}
];
let running=false,demoIndex=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function runFunctionalDemo(){
 if(running)return;
 running=true;
 app.dataset.decision="";
 functionalStatus.classList.add("on");
 functionalDecision.textContent="";
 const proposal=demos[demoIndex%demos.length];
 demoIndex++;
 for(const state of AEGIS_STATES){
   app.dataset.state=state;
   functionalState.textContent=state;
   if(state==="RECEIVED") functionalDecision.textContent="Proposal received";
   if(state==="ANALYSIS") functionalDecision.textContent="Evaluating action";
   if(state==="VERIFYING") functionalDecision.textContent="Checking evidence / risk / policy";
   if(state==="RESULT") functionalDecision.textContent="Result prepared";
   if(state!=="DECISION") await wait(650);
 }
 const result=aegisEvaluate(proposal);
 app.dataset.decision=result.decision;
 functionalDecision.textContent=result.decision+" · "+result.reason;
 await wait(1800);
 functionalStatus.classList.remove("on");
 running=false;
}
coreTrigger.addEventListener("click",runFunctionalDemo);

})();
</script>
</body>
</html>
